<svg width="850" height="330" viewBox="0 0 850 330" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Fundo -->
    <linearGradient id="bg" x1="0" y1="0" x2="850" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A120E"/>
      <stop offset="0.35" stop-color="#0C1712"/>
      <stop offset="0.7" stop-color="#0D1A14"/>
      <stop offset="1" stop-color="#0A1310"/>
    </linearGradient>

    <!-- Glows -->
    <radialGradient id="glowLeft" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(80 50) rotate(40) scale(310 220)">
      <stop stop-color="#6FD08A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6FD08A" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(780 45) rotate(140) scale(290 210)">
      <stop stop-color="#3C8C5F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3C8C5F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBottom" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(430 350) rotate(-90) scale(210 500)">
      <stop stop-color="#143C28" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#143C28" stop-opacity="0"/>
    </radialGradient>

    <!-- Vidro -->
    <linearGradient id="glass" x1="0" y1="0" x2="850" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14221B" stop-opacity="0.82"/>
      <stop offset="0.5" stop-color="#122019" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#0F1C15" stop-opacity="0.58"/>
    </linearGradient>

    <!-- Borda -->
    <linearGradient id="border" x1="0" y1="0" x2="850" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BFE4C4" stop-opacity="0.35"/>
      <stop offset="0.45" stop-color="#8FD39A" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#6FD08A" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Brilho -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#6FD08A" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow
        dx="0"
        dy="18"
        stdDeviation="22"
        flood-color="#000000"
        flood-opacity="0.55"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <clipPath id="cardClip">
      <rect x="20" y="20" width="810" height="290" rx="28"/>
    </clipPath>

  </defs>


  <!-- Fundo -->
  <rect width="850" height="330" fill="url(#bg)"/>

  <rect width="850" height="330" fill="url(#glowLeft)"/>
  <rect width="850" height="330" fill="url(#glowRight)"/>
  <rect width="850" height="330" fill="url(#glowBottom)"/>


  <!-- Glow atrás do card -->
  <rect
    x="30"
    y="30"
    width="790"
    height="270"
    rx="28"
    fill="#6FD08A"
    fill-opacity="0.08"
    filter="url(#softGlow)"
  />


  <!-- Card -->
  <g filter="url(#shadow)">

    <rect
      x="20"
      y="20"
      width="810"
      height="290"
      rx="28"
      fill="url(#glass)"
    />

    <rect
      x="20.5"
      y="20.5"
      width="809"
      height="289"
      rx="27.5"
      stroke="url(#border)"
      stroke-width="1"
    />

  </g>


  <!-- Conteúdo recortado -->
  <g clip-path="url(#cardClip)">

    <!-- Reflexo diagonal -->
    <path
      d="M-80 45L180 -20L850 190L850 250L-80 70Z"
      fill="url(#shine)"
      opacity="0.65"
    />

    <!-- Pequenos pontos decorativos -->
    <circle cx="765" cy="75" r="3" fill="#6FD08A" fill-opacity="0.35"/>
    <circle cx="785" cy="95" r="2" fill="#8FD39A" fill-opacity="0.25"/>
    <circle cx="745" cy="105" r="2" fill="#6FD08A" fill-opacity="0.20"/>

    <circle cx="75" cy="270" r="2" fill="#8FD39A" fill-opacity="0.22"/>
    <circle cx="92" cy="285" r="3" fill="#6FD08A" fill-opacity="0.16"/>


    <!-- LOGO HORIZONTAL -->
 
    <image
      href="banner.svg"
      x="65"
      y="52"
      width="300"
      height="80"
      preserveAspectRatio="xMinYMid meet"
    />


    <!-- Label -->
    <text
      x="65"
      y="160"
      fill="#8FD39A"
      font-family="Arial, Helvetica, sans-serif"
      font-size="11"
      font-weight="700"
      letter-spacing="2.4"
    >
      MAIN PROJECT
    </text>


    <!-- Descrição -->
    <text
      x="65"
      y="190"
      fill="#E9F5EC"
      font-family="Arial, Helvetica, sans-serif"
      font-size="17"
      font-weight="600"
    >
      Nutrition tracking application
    </text>

    <text
      x="65"
      y="214"
      fill="#93AB9D"
      font-family="Arial, Helvetica, sans-serif"
      font-size="14"
    >
      with AI integration.
    </text>


    <!-- Tags -->
    <g font-family="Arial, Helvetica, sans-serif" font-size="11">

      <rect
        x="65"
        y="242"
        width="58"
        height="26"
        rx="13"
        fill="#6FD08A"
        fill-opacity="0.10"
        stroke="#6FD08A"
        stroke-opacity="0.18"
      />

      <text
        x="94"
        y="259"
        text-anchor="middle"
        fill="#BFE4C4"
      >
        Java
      </text>


      <rect
        x="132"
        y="242"
        width="94"
        height="26"
        rx="13"
        fill="#6FD08A"
        fill-opacity="0.10"
        stroke="#6FD08A"
        stroke-opacity="0.18"
      />

      <text
        x="179"
        y="259"
        text-anchor="middle"
        fill="#BFE4C4"
      >
        Spring Boot
      </text>


      <rect
        x="235"
        y="242"
        width="91"
        height="26"
        rx="13"
        fill="#6FD08A"
        fill-opacity="0.10"
        stroke="#6FD08A"
        stroke-opacity="0.18"
      />

      <text
        x="280"
        y="259"
        text-anchor="middle"
        fill="#BFE4C4"
      >
        PostgreSQL
      </text>


      <rect
        x="335"
        y="242"
        width="78"
        height="26"
        rx="13"
        fill="#6FD08A"
        fill-opacity="0.10"
        stroke="#6FD08A"
        stroke-opacity="0.18"
      />

      <text
        x="374"
        y="259"
        text-anchor="middle"
        fill="#BFE4C4"
      >
        Spring AI
      </text>

    </g>


    <!-- Link -->
    <text
      x="725"
      y="258"
      text-anchor="middle"
      fill="#8FD39A"
      font-family="Arial, Helvetica, sans-serif"
      font-size="13"
      font-weight="700"
    >
      View project →
    </text>

  </g>

</svg>