<svg
    width="900"
    height="320"
    viewBox="0 0 900 320"
    xmlns="http://www.w3.org/2000/svg"
 xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

    <!-- =========================
         DEFINIÇÕES
         Cada linha tem seu próprio clipPath que "revela" o texto
         da esquerda pra direita, simulando digitação.
    ========================== -->
    <defs>
<!-- $ whoami -->
<clipPath id="clipL1">
    <rect x="30" y="74" width="0" height="24">
        <animate
            attributeName="width"
            from="0"
            to="100"
            dur="0.72s"
            begin="0.4s"
            fill="freeze"
        />
    </rect>
</clipPath>

<!-- vinicius-coelho -->
<clipPath id="clipL2">
    <rect x="30" y="112" width="0" height="24">
        <animate
            attributeName="width"
            from="0"
            to="176"
            dur="1.35s"
            begin="1.37s"
            fill="freeze"
        />
    </rect>
</clipPath>

<!-- $ role -->
<clipPath id="clipL3">
    <rect x="30" y="150" width="0" height="24">
        <animate
            attributeName="width"
            from="0"
            to="79"
            dur="0.54s"
            begin="3.17s"
            fill="freeze"
        />
    </rect>
</clipPath>

<!-- software development student -->
<clipPath id="clipL4">
    <rect x="30" y="188" width="0" height="24">
        <animate
            attributeName="width"
            from="0"
            to="327"
            dur="2.61s"
            begin="3.96s"
            fill="freeze"
        />
    </rect>
</clipPath>

<!-- $ focus -->
<clipPath id="clipL5">
    <rect x="30" y="226" width="0" height="24">
        <animate
            attributeName="width"
            from="0"
            to="90"
            dur="0.63s"
            begin="7.02s"
            fill="freeze"
        />
    </rect>
</clipPath>

<!-- backend · java · spring boot -->
<clipPath id="clipL6">
    <rect x="30" y="264" width="0" height="24">
        <animate
            attributeName="width"
            from="0"
            to="327"
            dur="2.61s"
            begin="7.90s"
            fill="freeze"
        />
    </rect>
</clipPath>

    </defs>


    <!-- =========================
         TERMINAL
    ========================== -->

    <rect width="900" height="320" rx="16" fill="#111714" />

    <!-- Borda -->
    <rect x="1" y="1" width="898" height="318" rx="16" fill="none" stroke="#26332b" />


    <!-- =========================
         BARRA SUPERIOR
    ========================== -->

    <rect width="900" height="52" rx="16" fill="#171e1a" />

    <circle cx="28" cy="26" r="6" fill="#ff5f56" />
    <circle cx="50" cy="26" r="6" fill="#ffbd2e" />
    <circle cx="72" cy="26" r="6" fill="#27c93f" />

    <text x="450" y="31" text-anchor="middle" font-family="monospace" font-size="13" fill="#6f7d73">
        vinicius@github: ~
    </text>


    <!-- =========================
         CONTEÚDO DO TERMINAL
    ========================== -->

    <g font-family="monospace" font-size="18">

        <!-- $ whoami -->
        <text x="30" y="90" fill="#8fba91" textLength="100" lengthAdjust="spacingAndGlyphs" clip-path="url(#clipL1)">$ whoami</text>

        <!-- vinicius-coelho -->
        <text x="30" y="128" fill="#d8e6dc" textLength="176" lengthAdjust="spacingAndGlyphs" clip-path="url(#clipL2)">vinicius-coelho</text>

        <!-- $ role -->
        <text x="30" y="166" fill="#8fba91" textLength="79" lengthAdjust="spacingAndGlyphs" clip-path="url(#clipL3)">$ role</text>

        <!-- software development student -->
        <text x="30" y="204" fill="#d8e6dc" textLength="327" lengthAdjust="spacingAndGlyphs" clip-path="url(#clipL4)">software development student</text>

        <!-- $ focus -->
        <text x="30" y="242" fill="#8fba91" textLength="90" lengthAdjust="spacingAndGlyphs" clip-path="url(#clipL5)">$ focus</text>

        <!-- backend · java · spring boot -->
        <text x="30" y="280" fill="#d8e6dc" textLength="327" lengthAdjust="spacingAndGlyphs" clip-path="url(#clipL6)">backend · java · spring boot</text>

    </g>


    <!-- =========================
         CURSOR
         Um único cursor que se move junto com cada linha sendo
         digitada e pula para a linha seguinte no momento certo.
    ========================== -->

    <rect id="cursor" x="30" y="74" width="10" height="22" fill="#8fba91">

        <!-- posição Y: salta para a linha atual pouco antes dela começar a digitar -->
        <set attributeName="y" to="74"  begin="0s" />
        <set attributeName="y" to="112" begin="1.37s" />
        <set attributeName="y" to="150" begin="3.17s" />
        <set attributeName="y" to="188" begin="3.96s" />
        <set attributeName="y" to="226" begin="7.02s" />
        <set attributeName="y" to="264" begin="7.90s" />

        <!-- posição X: reseta para o início da linha, depois acompanha a digitação -->
        <set attributeName="x" to="30" begin="0s" />
        <animate attributeName="x" from="30" to="136" dur="0.72s" begin="0.4s"  fill="freeze" />

        <set attributeName="x" to="30" begin="1.37s" />
        <animate attributeName="x" from="30" to="212" dur="1.35s" begin="1.37s" fill="freeze" />

        <set attributeName="x" to="30" begin="3.17s" />
        <animate attributeName="x" from="30" to="115" dur="0.54s" begin="3.17s" fill="freeze" />

        <set attributeName="x" to="30" begin="3.96s" />
        <animate attributeName="x" from="30" to="363" dur="2.61s" begin="3.96s" fill="freeze" />

        <set attributeName="x" to="30" begin="7.02s" />
        <animate attributeName="x" from="30" to="126" dur="0.63s" begin="7.02s" fill="freeze" />

        <set attributeName="x" to="30" begin="7.90s" />
        <animate attributeName="x" from="30" to="363" dur="2.61s" begin="7.90s" fill="freeze" />

        <!-- piscar continuamente -->
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="0s" repeatCount="indefinite" />

    </rect>

</svg>